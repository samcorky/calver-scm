name: Build distributions

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches: [main]

  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: "Build: wheel + sdist tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for setuptools-scm to derive the version from Git history
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # No cache for the files that are published: a cache written by another run
          # must not feed into them. Publish calls this workflow on a release event.
          enable-cache: ${{ github.event_name != 'release' }}

      - name: Install Python
        run: uv python install

      # Builds the wheel and sdist, then runs the full test suite against each to
      # ensure integrity (pythonpath is emptied so the installed package is imported,
      # not src/)
      - name: Build and test distributions
        run: uv run --frozen poe build-check

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
