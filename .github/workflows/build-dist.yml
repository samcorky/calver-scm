name: Build distributions

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches: [main]

  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: "Build: wheel + sdist tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Required for setuptools-scm to derive the version from Git history
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      # Builds the wheel and sdist, then runs the full test suite against each to
      # ensure integrity (pythonpath is emptied so the installed package is imported,
      # not src/)
      - name: Build and test distributions
        run: uv run --frozen poe build-check

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
