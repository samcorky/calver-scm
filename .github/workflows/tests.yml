name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: "Tests: Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run pytest
        run: uv run poe test --cov-report=xml

      - name: Upload coverage artefact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

  coverage:
    name: "Tests: Codecov upload"
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v7

      - name: Download coverage artefact
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: true

  tests-passed:
    name: "Tests: all passed"
    runs-on: ubuntu-latest
    needs: [tests, coverage]
    # Run even when a needed job fails or is cancelled, so this check always
    # reports; a skipped dependency would otherwise leave it "skipped" (passing).
    if: always()

    steps:
      - name: Check every job succeeded
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
