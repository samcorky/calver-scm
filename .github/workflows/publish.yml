name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-tag:
    name: Check the release tag
    # Nothing is built or published for a tag that is not a release tag on main.
    if: github.event_name == 'release' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag is semver (vX.Y.Z)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Pq '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::Tag '$TAG' is not a valid semver tag (expected vX.Y.Z). Aborting publish."
            exit 1
          fi
          echo "Tag '$TAG' is valid semver. Proceeding with publish."

      # A release made from a tag on another branch must not reach PyPI.
      - name: Check the release tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" origin/main; then
            echo "::error::${TAG} is not on main; nothing is published."
            exit 1
          fi

  build-and-test:
    needs: check-tag
    uses: ./.github/workflows/build-dist.yml

  publish:
    name: Publish to PyPI
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/calver-scm
    permissions:
      id-token: write # trusted publishing, and signing both kinds of attestation
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # A GitHub attestation: gh attestation verify <file> --owner samcorky.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Uploads through trusted publishing with PEP 740 attestations, which pypi.org
      # shows as the files' provenance. The trusted publisher names this workflow,
      # publish.yml, and the pypi environment.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
