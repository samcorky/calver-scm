name: autofix.ci # needed by autofix.ci to securely identify the workflow

on:
  pull_request:

permissions:
  contents: read

jobs:
  autofix:
    name: "Hooks: prek (autofix)"
    runs-on: ubuntu-latest
    env:
      # Covered by their own jobs and workflows (lint, format, tests, renovate-config)
      SKIP: ruff-check,ruff-format,mypy,pytest,renovate-config-validator

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply hook fixes
        # A hook that rewrites a file exits non-zero; autofix.ci commits those
        # rewrites below and the final run reports anything left unfixed.
        run: uv run prek run --all-files || true

      - name: Push fixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "style: apply hook fixes"

      - name: Check hooks
        run: uv run prek run --all-files
